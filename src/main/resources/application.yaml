spring:
  application:
    name: lovable-clone

  datasource:
    url: ${DB_URL}
    username: user
    password: ${DB_PW}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  ai:
    openai:
      api-key: ${SPRING_AI_OPEN_AI_KEY}
      base-url: https://openrouter.ai/api
      chat:
        options:
          model: tencent/hy3:free
          temperature: 0.0


jwt:
  secret-key: ${JWT_SECRET_KEY}


stripe:
  api:
    secret: ${STRIPE_API_SECRET}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}
client.url: http://localhost:8080

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG
    org.springframework.security: DEBUG

minio:
  url: http://localhost:9000          # or minio:9000 if inside docker network
  access-key: minioadmin
  secret-key: minioadmin123
  project-bucket: projects